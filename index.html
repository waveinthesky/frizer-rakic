*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--hdr)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;margin:0}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--brass-strong);outline-offset:2px}
svg{flex:none}
[hidden]{display:none!important}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr);color:var(--hdr-ink);border-bottom:1px solid var(--hdr-line)}
.pole{height:7px;overflow:hidden}
.pole::before{content:"";display:block;height:100%;width:calc(100% + 40px);margin-left:-39.6px;
  background-image:repeating-linear-gradient(-45deg,var(--pole-red) 0 9px,var(--pole-white) 9px 14px,var(--pole-blue) 14px 23px,var(--pole-white) 23px 28px);
  animation:pole 4s linear infinite}
@keyframes pole{to{transform:translateX(39.6px)}}
.top-in{max-width:640px;margin:0 auto;padding:12px 16px 13px;display:flex;align-items:center;gap:12px}

.brand{flex:1;min-width:0}
.top h1{font:400 23px/1.15 var(--brandfont);letter-spacing:.035em;text-transform:uppercase;margin:0;padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--hdr-ink);background:var(--brand-fill);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;border:1.5px solid #9A9CA3;box-shadow:0 0 0 2px var(--hdr),0 0 0 3.5px var(--pole-red)}
.logo-full{display:block;width:100%;height:auto;margin:0 0 18px;border-radius:var(--lf-radius);box-shadow:var(--lf-shadow);filter:var(--lf-filter)}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.skin{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:600}
.skin[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 1.5px var(--green)}
.skin small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.sw{width:32px;height:32px;border-radius:50%;flex:none;border:1px solid rgba(128,128,128,.35);box-shadow:inset 0 0 0 3px rgba(255,255,255,.08)}

.sync{margin-left:auto;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--sync-bg);color:var(--hdr-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:#C9B27A}
.sync.ok i{background:#6CC097}
.sync.bad i{background:#E0786F}
@media (max-width:480px){.sync{padding:8px;margin-right:-4px}.sync span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.sync i{width:9px;height:9px}}

.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(150px + var(--tick-h,0px) + env(safe-area-inset-bottom,0px))}
/* Week */

.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0}
.day .dn{font-size:12px;color:var(--muted);font-weight:600}
.day .dd{font:700 23px/1 var(--display)}
.day .dc{font-size:11px;line-height:14px;height:14px;color:var(--brass);font-weight:700}
.day.is-today .dd{color:var(--brass)}
.day.closed .dn,.day.closed .dd{opacity:.5}
.day[aria-current="date"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.day[aria-current="date"] .dn{color:var(--on-green-muted)}
.day[aria-current="date"] .dd{color:var(--on-green);opacity:1}
.day[aria-current="date"] .dc{color:var(--brass-strong)}
/* Day head */

.dayhead h2,.vhead h2{font:800 36px/1 var(--display);margin:0}
.dayhead p,.vhead p{margin:4px 0 0;color:var(--muted);font-size:14px}

.next{font-size:14px;margin:12px 2px 0;color:var(--muted)}
.next strong{color:var(--ink)}
/* Timeline */

.row{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start}
.row .t{font:700 21px/1 var(--display);padding-top:15px;font-variant-numeric:tabular-nums}
.row .t small{display:block;font:600 14px/1.2 var(--display);color:var(--muted);margin-top:3px}
.row.free-row .t{color:var(--muted);font-weight:600}
.row.past{opacity:.5}
.free{width:100%;min-height:46px;margin:4px 0;border:1.5px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;color:var(--muted);font-size:14px;text-align:left}
.free .plus{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.free:hover,.free:active{border-color:var(--brass-strong);color:var(--ink);background:var(--brass-soft)}

.badge{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-top:4px;background:var(--brass-soft);color:var(--brass)}
.badge.zavrsen{background:var(--ok-soft);color:var(--ok)}
.badge.nije_dosao{background:var(--red-soft);color:var(--red)}
.badge.otkazan{background:var(--surface-2);color:var(--muted)}

.empty{text-align:center;padding:34px 18px;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px;margin-top:14px;font-size:15px}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.note-closed{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted);margin-top:12px}
details.cx{margin-top:18px}
details.cx summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px;padding:6px 0}

/* FAB + nav */
.fab{position:fixed;z-index:25;right:max(16px,calc(50% - 304px));bottom:calc(80px + var(--tick-h,0px) + env(safe-area-inset-bottom,0px));height:54px;padding:0 20px 0 16px;border-radius:999px;background:var(--fab);color:var(--on-fab);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 26px -10px rgba(0,0,0,.5)}
.tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tab[aria-current="page"]{color:var(--tab-active)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--brass-strong)}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:transparent;transition:background .22s}
.sheet-wrap.open{background:var(--overlay)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding:0 18px;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .sheet{transform:none}
.sheet-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:10px;padding:20px 0 12px;z-index:2}
.sheet-head::before{content:"";position:absolute;top:7px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--line)}
.sheet-head h3{margin:0;font:800 28px/1.05 var(--display);flex:1;min-width:0;overflow-wrap:anywhere}
.x{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.when{font-size:15px;color:var(--muted);margin:-4px 0 12px}
.when strong{color:var(--ink)}

/* Forms */
.field{display:block;margin:0 0 16px}
.field>span,.lbl{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.lbl em{font-style:normal;color:var(--ink)}
.inp{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:16px;-webkit-appearance:none;appearance:none}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea.inp{height:auto;padding:12px 14px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--brass-strong);outline:none;background:var(--surface)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:16px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{height:40px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.svc{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;background:var(--surface)}
.svc b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.svc span{font-size:13px;color:var(--muted)}
.svc[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:var(--on-green)}
.svc[aria-pressed="true"] span{color:var(--on-green-muted)}
.svc[aria-pressed="true"] i{color:var(--on-green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:42px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;position:relative;overflow:hidden}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.chip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.time-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.time-grid .chip{flex-direction:column;justify-content:center;gap:2px;height:48px;padding:0 4px;font:700 18px/1 var(--display);font-variant-numeric:tabular-nums;border-radius:10px}
.time-grid .chip small{display:block;width:100%;font:600 11px/1.1 var(--body);text-align:center;color:var(--muted);text-decoration:none}
.time-grid .chip:disabled{opacity:.3;cursor:not-allowed}
.time-grid .chip:disabled .ct{text-decoration:line-through}
.time-grid .chip.busy{opacity:.85;background:var(--surface-2);border-style:dashed}
.time-grid .chip.busy .ct{color:var(--muted)}
.time-grid .chip.late{border-style:dashed}
.custom-time{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}
.custom-time .inp{width:130px;height:42px}
.hint{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.sugg{display:flex;flex-direction:column;gap:6px;margin:-8px 0 16px}
.sugg button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:12px;background:var(--brass-soft)}
.sugg small{display:block;color:var(--muted);font-size:13px}
.av{width:38px;height:38px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font:700 16px/1 var(--display);flex:none;letter-spacing:.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{font-size:14px;font-weight:600;color:var(--red);margin:0 0 12px}
.msg:empty{display:none}
.warnbox{background:var(--red-soft);color:var(--red);border-radius:12px;padding:11px 13px;font-size:14px;margin-bottom:14px;font-weight:500}
.primary{width:100%;height:54px;border-radius:14px;background:var(--green);color:var(--on-green);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.primary.warn{background:var(--red);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);padding:0 10px;text-align:center}
.btn.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.btn.bad{border-color:transparent;background:var(--red-soft);color:var(--red)}
.btn.plain{border-color:transparent;background:var(--surface-2)}
.btn-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.btn-row.two-c{grid-template-columns:1fr 1fr}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 14px}
.dgrid>div{background:var(--surface);padding:10px 12px;min-width:0}
.dgrid dt{font-size:12.5px;color:var(--muted)}
.dgrid dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.dgrid a{text-decoration:none}
.notebox{background:var(--brass-soft);border-radius:12px;padding:10px 13px;font-size:15px;margin:0 0 14px}
.sub-h{font:800 20px/1 var(--display);margin:20px 0 10px}
.hist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hist li{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:14px}
.hist li+li{border-top:1px solid var(--line)}
.hist .hd{flex:1;min-width:0}
.hist .hd small{display:block;color:var(--muted)}
.hist .badge{margin:0}

/* Dialog + toast */
.dialog-wrap{position:fixed;inset:0;z-index:70;background:var(--overlay);display:grid;place-items:center;padding:24px}
.dialog{background:var(--surface);border-radius:18px;padding:22px 20px 18px;max-width:360px;width:100%;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.dialog p{margin:0 0 18px;font-size:16px}
.toast{position:fixed;z-index:80;left:50%;bottom:calc(146px + var(--tick-h,0px) + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;transition:.22s;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14.5px;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Clients */
.vhead{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;margin-bottom:14px;color:var(--muted)}
.search:focus-within{border-color:var(--brass-strong)}
.search input{border:0;background:none;flex:1;outline:none;font-size:16px;height:100%;color:var(--ink);min-width:0}
.clist{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.clist li+li{border-top:1px solid var(--line)}
.citem{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left}
.cmain{flex:1;min-width:0}
.cname{font-weight:700}
.csub{font-size:13px;color:var(--muted)}
.cnext{font-size:12.5px;font-weight:700;color:var(--brass)}
.ccount{text-align:right;flex:none}
.ccount b{display:block;font:700 22px/1 var(--display)}
.ccount span{font-size:11.5px;color:var(--muted)}

/* Stats */
.period{display:flex;align-items:center;gap:8px;margin:-4px 0 14px}
.period .lab{flex:1;text-align:center;font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn:disabled{opacity:.35}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.kpis>div{background:var(--surface);padding:14px}
.kpis b{display:block;font:800 30px/1 var(--display);white-space:nowrap}
.kpis span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 14px;font:800 21px/1 var(--display)}
.panel.attn{background:var(--brass-soft);border-color:transparent}
.panel.attn p{margin:0 0 12px;font-size:15px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;min-height:150px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:36px;border-radius:6px 6px 2px 2px;background:var(--green);min-height:3px}
.bar.best i{background:var(--brass-strong)}
.bar em{font-style:normal;font-size:13px;font-weight:700}
.bar span{font-size:12px;color:var(--muted)}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.rt{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;margin-bottom:5px}
.rt span:last-child{color:var(--muted);white-space:nowrap}
.meter{height:7px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brass-strong);border-radius:7px}
.muted{color:var(--muted)}
/* Settings */

.tog{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tog{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.tog input{width:22px;height:22px;accent-color:var(--green);margin:0;flex:none}
.svc-row{display:grid;grid-template-columns:30px minmax(0,1fr) 40px;gap:10px;align-items:start;padding:12px 12px}
.svc-row+.svc-row{border-top:1px solid var(--line)}
.svc-row .inp{height:44px;padding:0 12px}

.del{width:40px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--red);background:var(--red-soft)}
.about{font-size:14px;color:var(--muted);margin:0}

/* v2: traka dana, agenda, jednostavniji formular */
.sheet>:last-child:not(.sheet-foot){margin-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.dstrip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px 18px;padding:2px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dstrip::-webkit-scrollbar{display:none}
.ds{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:14px;background:var(--surface);border:1px solid var(--line);scroll-snap-align:start;position:relative;overflow:hidden;cursor:pointer}
.ds-n{font-size:12.5px;font-weight:600;color:var(--muted)}
.ds-d{font:700 26px/1 var(--display)}
.ds-c{min-width:20px;height:18px;padding:0 5px;border-radius:9px;font-size:11.5px;font-weight:700;line-height:18px;text-align:center;background:var(--brass-soft);color:var(--brass)}
.ds-c:empty{visibility:hidden}
.ds.closed .ds-d,.ds.closed .ds-n{opacity:.45}
.ds[aria-current="date"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.ds[aria-current="date"] .ds-n{color:var(--on-green-muted);opacity:1}
.ds[aria-current="date"] .ds-d{opacity:1}
.ds[aria-current="date"] .ds-c{background:var(--brass-strong);color:var(--on-brass)}
.ds.cal{justify-content:center;gap:6px;color:var(--muted);border-style:dashed}
.ds.cal input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.dstrip.sm .ds{width:52px;border-radius:12px;padding:7px 0 6px}
.dstrip.sm .ds-d{font-size:22px}
.dhead{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start}
.dhead>div:first-child{flex:1;min-width:0}
.dhead h2{font:800 40px/1 var(--display);margin:0}
.dhead p{margin:5px 0 0;color:var(--muted);font-size:15px}
.dhead .dsum{color:var(--ink);font-weight:600;margin-top:2px}
.agenda{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.fb{border:1.5px dashed var(--free-line);background:var(--free-soft);border-radius:16px;padding:10px 10px 12px}
.fb-l{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--free);margin:0 2px 9px}
.fchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.fchip{height:46px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font:700 20px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center}
.fchip small{font:700 11px/1 var(--body);color:var(--brass);margin-top:3px}
.fchip.short{border:1.5px dashed var(--brass-strong)}
.demo-note{background:var(--brass-soft);border-radius:14px;padding:11px 14px;margin:0 0 14px;font-size:14px;color:var(--ink)}
.demo-note strong{display:block;font:800 19px/1.1 var(--display);color:var(--brass);margin-bottom:2px}
.gapcard{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;margin:0 0 14px;border-radius:16px;background:var(--brass-soft);border:1.5px dashed var(--brass-strong)}
.gapcard div{flex:1;min-width:0}
.gapcard strong{display:block;font:800 22px/1.1 var(--display)}
.gapcard span{font-size:14px;color:var(--muted)}
.gapcard .btn{flex:none;background:var(--green);color:var(--on-green);border-color:transparent}
.seg.four{grid-template-columns:repeat(4,1fr);margin-bottom:10px}
.extra-names{display:grid;gap:8px;margin-bottom:6px}
.fit-hint{margin:-2px 0 8px;font-size:14px;font-weight:600;color:var(--brass)}
.svc.nofit{opacity:.5}
.svc.nofit[aria-pressed="true"]{opacity:1}
.tag.grp{background:var(--surface-2);color:var(--ink)}
.fchip{border-color:var(--free-line)}
.fchip:hover,.fchip:active{background:var(--free-strong);border-color:var(--free)}
.fchip.first{background:var(--free);border-color:var(--free);color:#fff;box-shadow:0 6px 14px -8px var(--free)}
.fchip.first small{color:rgba(255,255,255,.88)}
.ar{width:100%;display:grid;grid-template-columns:72px minmax(0,1fr) 20px;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px 14px 0;box-shadow:var(--shadow);position:relative;overflow:hidden}
.ar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--svc,var(--brass-strong))}
.ar-t{text-align:center;padding-left:5px}
.ar-t b{display:block;font:800 25px/1 var(--display);font-variant-numeric:tabular-nums}
.ar-t small{display:block;font:600 14px/1.2 var(--display);color:var(--muted);margin-top:4px}
.ar-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.ar-b strong{font:800 23px/1.12 var(--display);letter-spacing:.01em}
.ar-b>span{font-size:14.5px;color:var(--muted)}
.ar-b>.ar-note{color:var(--ink);font-size:13.5px;display:flex;gap:5px;align-items:center}
.ar-go{color:var(--muted);display:grid;place-items:center}
.ar.is-next{border-color:var(--brass-strong);box-shadow:0 0 0 1.5px var(--brass-strong),var(--shadow)}
.ar.st-otkazan::before{background:var(--muted)}
.ar.pauza{background:repeating-linear-gradient(-45deg,var(--surface) 0 10px,var(--surface-2) 10px 20px);box-shadow:none}
.ar.pauza::before{background:var(--muted)}
.ar.dim{opacity:.55;box-shadow:none;filter:saturate(.35)}
.tag{align-self:flex-start;display:inline-block;font-style:normal;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--brass-soft);color:var(--brass);margin-top:4px}
.tag.zavrsen{background:var(--ok-soft);color:var(--ok)}
.tag.nije_dosao{background:var(--red-soft);color:var(--red)}
.tag.otkazan{background:var(--surface-2);color:var(--muted)}
.step-l{font-weight:700;font-size:16px;margin:0 0 10px}
.whenbox{width:100%;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:var(--hero);color:var(--on-hero);text-align:left;margin-bottom:12px}
.whenbox b{font:800 38px/1 var(--display);font-variant-numeric:tabular-nums}
.whenbox span{flex:1;min-width:0}
.whenbox strong{display:block;font-size:16px}
.whenbox small{display:block;color:var(--hero-muted);font-size:13.5px}
.whenbox em{font-style:normal;font-weight:700;font-size:14px;color:var(--brass-strong)}
.picker{background:var(--surface-2);border-radius:16px;padding:12px;margin-bottom:18px}
.picker .dstrip{margin:0 -12px 10px;padding:0 12px 2px}
.pick-day{margin:0 2px 10px;font-weight:600;font-size:14.5px}
.picker .chip{background:var(--surface)}
.picker .chip[aria-pressed="true"]{background:var(--green)}
.inp.big{height:54px;font-size:18px}
.svc-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.svc{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:6px;align-items:baseline}
.svc b{grid-column:1/3}
.svc i{font-style:normal;font-weight:700;font-size:13.5px;color:var(--brass);text-align:right}
.svc[aria-pressed="true"] i{color:var(--brass-strong)}
details.more{border-top:1px solid var(--line);margin:4px 0 0}
details.more summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:600;display:flex;align-items:baseline;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";font:700 20px/1 var(--display);width:18px;color:var(--brass)}
details.more[open] summary::before{content:"–"}
details.more summary small{color:var(--muted);font-weight:400;font-size:13px}
.tog.wrap{white-space:normal;margin-bottom:6px;font-weight:500}
.sheet-foot{position:sticky;bottom:0;background:var(--surface);padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));margin-top:6px;z-index:2;box-shadow:0 -12px 16px -12px var(--surface)}
.sheet-foot .warnbox{margin-bottom:10px}
.dsvc{font-size:16.5px;margin:-6px 0 14px}
.dinfo{font-size:14.5px;color:var(--muted);margin:2px 0 6px;line-height:1.55}
.btn.big{min-height:56px;font-size:16px}
.linkrow{display:flex;border-top:1px solid var(--line);margin:10px -18px 0;padding:0 6px}
.linkrow button{flex:1;height:54px;font-weight:600;font-size:15px}
.linkrow button+button{border-left:1px solid var(--line)}
.linkrow .danger{color:var(--red)}

/* v3: sljedeći klijent, podsjetnici, bilješke, boje */
.nextcard{background:var(--hero);color:var(--on-hero);border-radius:18px;padding:14px 16px 16px 22px;margin:0 0 16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.nextcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--svc,var(--brass-strong))}
.nc-l{font-size:13px;font-weight:600;color:var(--hero-muted)}

.nc-when{font:800 19px/1 var(--display);color:var(--brass-strong);white-space:nowrap}
.nc-note{margin:10px 0 0;font-size:14.5px;display:flex;gap:6px;align-items:flex-start;color:var(--on-hero)}
.nc-note svg{margin-top:3px}
.nc-btns{display:flex;gap:8px;margin-top:14px}
.nc-btns .btn{flex:1;min-height:46px;background:rgba(255,255,255,.1);border-color:transparent;color:var(--on-hero)}
.nc-btns .btn.ok{background:var(--ok-soft);color:var(--ok)}
.rem-open{display:inline-flex;align-items:center;gap:7px;margin-top:10px;height:40px;padding:0 14px;border-radius:999px;background:var(--brass-soft);color:var(--brass);font-weight:700;font-size:14.5px}
.rem-open.done{background:var(--ok-soft);color:var(--ok)}
.rem-open svg{width:16px;height:16px}
.ar-rem{display:inline-flex;align-items:center;gap:4px;color:var(--ok)!important;font-size:12.5px!important;font-weight:600}
.ar-rem svg{width:13px;height:13px}
.prog{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:8px;transition:width .3s}
.prog-l{font-size:13.5px;color:var(--muted);margin:6px 0 14px}
.rem-list{list-style:none;padding:0;margin:0 0 12px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rem-list li{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 10px 10px 12px}
.rem-list li+li{border-top:1px solid var(--line)}
.rem-list li>b{font:800 20px/1 var(--display)}
.rem-list .rm strong{display:block}
.rem-list .rm small{color:var(--muted);font-size:13px}
.rem-list li.sent{background:var(--ok-soft)}
.rem-list li.sent .rm small{color:var(--ok);font-weight:700}
.rem-btns{display:flex;gap:6px}
.btn.sm{min-height:40px;padding:0 10px;font-size:14px;gap:5px}
.btn.sm svg{width:15px;height:15px}
.rebook{background:var(--brass-soft);border-radius:14px;padding:12px;margin:0 0 12px}
.rebook p{margin:0 0 10px;font-weight:700}
.rb-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rb-btns .chip{justify-content:center;padding:0 8px;font-size:14.5px}
.nb-l{display:block;font-size:12.5px;font-weight:700;color:var(--brass);margin-bottom:2px}
.addnote{display:inline-flex;align-items:center;gap:6px;color:var(--brass);font-weight:600;font-size:14.5px;padding:6px 0 4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0}
.cdot{width:30px;height:44px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center}
.cdot::after{content:"";width:18px;height:18px;border-radius:50%;background:var(--c)}

/* Uvodna animacija loga */
.splash{position:fixed;inset:0;z-index:100;overflow:hidden;cursor:pointer;transition:opacity .35s ease}
.nosplash .splash{display:none}
.splash.out{opacity:0}
.splash:not(.run) *{animation-play-state:paused!important}
.sp-half{position:absolute;inset:0;display:grid;place-items:center;background:var(--sp-bg);will-change:transform,opacity}
.sp-top{clip-path:inset(0 0 50% 0);animation:spUp .62s cubic-bezier(.7,0,.25,1) 2.12s forwards}
.sp-bot{clip-path:inset(50% 0 0 0);animation:spDown .62s cubic-bezier(.7,0,.25,1) 2.12s forwards}
@keyframes spUp{to{transform:translateY(-54%) rotate(-1.5deg);opacity:.15}}
@keyframes spDown{to{transform:translateY(54%) rotate(1.5deg);opacity:.15}}
.sp-stage{position:relative;width:min(90vw,520px);overflow:var(--sp-ovf,hidden);filter:var(--sp-filter,none);border-radius:var(--sp-radius);box-shadow:var(--sp-shadow);animation:spFade .5s ease both}
.sp-logo{display:block;width:100%;height:auto;-webkit-mask-image:var(--sp-mask);mask-image:var(--sp-mask);animation:spIn 1.15s cubic-bezier(.2,.8,.2,1) both}
@keyframes spIn{0%{opacity:0;transform:scale(1.25);filter:blur(16px) brightness(.15)}55%{opacity:1;filter:blur(0) brightness(1.3)}100%{opacity:1;transform:scale(1);filter:none}}
.sp-shine{opacity:var(--shine-op,1);position:absolute;top:-10%;bottom:-10%;left:0;width:34%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);mix-blend-mode:overlay;transform:translateX(-160%) skewX(-18deg);animation:spShine .85s ease-in-out .8s forwards;pointer-events:none}
@keyframes spShine{to{transform:translateX(400%) skewX(-18deg)}}
.sp-cut{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,var(--cut-core) 12%,var(--cut-core));box-shadow:0 0 10px 1px var(--cut-glow),0 0 28px 4px var(--cut-glow);transform:scaleX(0);transform-origin:0 50%;animation:spCut .78s cubic-bezier(.45,0,.55,1) 1.32s forwards,spGone .25s ease 2.12s forwards}
@keyframes spCut{to{transform:scaleX(1)}}
@keyframes spGone{to{opacity:0}}
.sp-scissors{position:absolute;top:50%;left:0;width:110px;height:55px;margin-top:-27.5px;transform:translateX(-130px);animation:spTravel .78s cubic-bezier(.45,0,.55,1) 1.32s forwards;filter:drop-shadow(0 4px 10px rgba(0,0,0,.7)) drop-shadow(0 0 8px rgba(196,30,38,.4))}

function mergeSettings(x){

  d.posebno={};
  if(x.posebno&&typeof x.posebno==='object'){Object.keys(x.posebno).filter(validD).sort().slice(-400).forEach(k=>{const iv=normIntervals(x.posebno[k]&&x.posebno[k].intervali,null);if(iv)d.posebno[k]={intervali:iv};});}

  d.neradni=Array.isArray(x.neradni)?[...new Set(x.neradni.filter(validD))].sort().slice(-400):[];
  if(x.radno&&typeof x.radno==='object'){
    Object.keys(d.radno).forEach(k=>{const r=x.radno[k];if(r&&typeof r==='object'){const od=validT(r.od)?r.od:d.radno[k].od,dd=validEnd(r.do)?r.do:d.radno[k].do;d.radno[k]={radi:!!r.radi,intervali:normIntervals(r.intervali,null)||normIntervals([{od,do:dd}],[{od:d.radno[k].od,do:d.radno[k].do}])};}});
  }
  if(Array.isArray(x.usluge)){
    const u=x.usluge.filter(s=>s&&typeof s.naziv==='string'&&s.naziv.trim()).map((s,i)=>({id:str(String(s.id||''),40)||uid('s'),naziv:s.naziv.trim().slice(0,60),trajanje:clampInt(s.trajanje,5,480,30),cijena:Math.max(0,Number(s.cijena)||0),boja:clampInt(s.boja,0,7,i%8)}));

  Object.keys(d.radno).forEach(k=>{const r=d.radno[k];const iv=normIntervals(r.intervali,null)||normIntervals([{od:r.od,do:r.do}],[{od:'08:00',do:'20:00'}]);d.radno[k]={radi:!!r.radi,intervali:iv,od:iv[0].od,do:iv[iv.length-1].do};});

}

function byDate(d){

function validEnd(s){return validT(s)||s==='24:00';}
function mtE(n){return n>=1440?'24:00':mt(n);}
function fmtH(m){const h=Math.floor(m/60),r=m%60;return r===0?h+'h':r===30?h+',5h':h+'h'+pad(r);}
function ivMinutes(iv){return iv.reduce((a,x)=>a+Math.max(0,tm(x.do)-tm(x.od)),0);}
function normIntervals(arr,fallback){
  const iv=(Array.isArray(arr)?arr:[]).filter(x=>x&&validT(x.od)&&validEnd(x.do)&&tm(x.od)<tm(x.do)).map(x=>({od:x.od,do:x.do})).sort((a,b)=>tm(a.od)-tm(b.od));
  const out=[];for(const x of iv){const l=out[out.length-1];if(l&&tm(x.od)<=tm(l.do)){if(tm(x.do)>tm(l.do))l.do=x.do;}else out.push(x);}
  return out.length?out.slice(0,6):fallback;
}
function hoursFor(date){
  const s=state.settings,b=s.radno[String(pd(date).getDay())]||{radi:false,od:'08:00',do:'20:00'};
  const ivb=b.intervali&&b.intervali.length?b.intervali:[{od:b.od,do:b.do}];
  const mk=(radi,iv,extra)=>Object.assign({radi,intervali:iv,od:iv[0].od,do:iv[iv.length-1].do},extra||{});
  if((s.neradni||[]).includes(date))return mk(false,ivb,{odmor:true});
  const sp=s.posebno&&s.posebno[date];
  if(sp&&sp.intervali&&sp.intervali.length)return mk(true,sp.intervali,{posebno:true});
  return mk(!!b.radi,ivb);
}
function ivMin(h){return h.intervali.map(x=>[tm(x.od),tm(x.do)]);}
function ivText(h){const a=h.intervali.map(x=>x.od+'–'+x.do);return a.length<2?a[0]:a.slice(0,-1).join(', ')+' i '+a[a.length-1];}
function conflicts(date,start,dur,exceptId){
  return byDate(date).filter(a=>a.id!==exceptId&&a.status!=='otkazan'&&tm(a.vrijeme)<start+dur&&endOf(a)>start);
}
function freeIntervals(date,open,close,exceptId){
  const busy=byDate(date).filter(a=>a.status!=='otkazan'&&a.id!==exceptId).map(a=>[tm(a.vrijeme),endOf(a)]).sort((p,q)=>p[0]-q[0]);
  const out=[];let cur=open;
  for(const [b0,b1] of busy){if(b1<=cur)continue;if(b0>cur)out.push([cur,Math.min(b0,close)]);cur=Math.max(cur,b1);if(cur>=close)break;}
  if(cur<close)out.push([cur,close]);
  return out.filter(x=>x[1]>x[0]);
}
function availFrom(date,start,exceptId){
  const h=hoursFor(date);let close=24*60;if(h.radi){const iv=ivMin(h).find(([o,c])=>start>=o&&start<c);close=iv?iv[1]:start+600;}
  let next=start<close?close:start+600;
  for(const a of byDate(date)){
    if(a.status==='otkazan'||a.id===exceptId)continue;
    const b0=tm(a.vrijeme),b1=endOf(a);
    if(b0<=start&&b1>start)return 0;
    if(b0>start&&b0<next)next=b0;
  }
  return next-start;
}

    c.sortKey=c.sljedeca?'2'+c.sljedeca.datum:(c.zadnja?'1'+c.zadnja.datum:'0');

function fitText(root){
  (root||document).querySelectorAll('.fit').forEach(el=>{
    if(!el.dataset.max){el.style.fontSize='';el.dataset.max=parseFloat(getComputedStyle(el).fontSize)||16;}
    const max=Number(el.dataset.max),min=Number(el.dataset.min)||12;
    el.classList.remove('fit-wrap');el.style.fontSize=max+'px';
    const w=el.clientWidth;if(!w)return;
    if(el.scrollWidth<=w+1)return;
    let sz=Math.max(min,Math.floor(max*w/el.scrollWidth));

    while(el.scrollWidth>w+1&&sz>min){sz-=1;el.style.fontSize=sz+'px';}
    if(el.scrollWidth>w+1)el.classList.add('fit-wrap');
  });
}

function scheduleHTML(){
  const s=state.settings,date=state.date,t=today(),nm=nowMin(),step=s.interval;
  const d=pd(date);
  const strip=[];for(let i=0;i<28;i++)strip.push(addDays(t,i));
  if(!strip.includes(date))strip.unshift(date);
  const stripHTML=dayStrip(strip,date,'pick');
  const h=hoursFor(date);
  const all=apptsOn(date);
  const active=all.filter(a=>a.status!=='otkazan');
  const cancelled=all.filter(a=>a.status==='otkazan');
  const clients=active.filter(a=>a.tip==='klijent');
  const income=clients.filter(a=>a.status!=='nije_dosao').reduce((x,a)=>x+a.cijena,0);

  const entries=[];
  if(h.radi){
    ivMin(h).forEach(([open,close])=>{
    freeIntervals(date,open,close,null).forEach(([fs,fe])=>{
      let x=fs;const off=(x-open)%step;
      if(off){const ng=Math.min(fe,x+(step-off));if(ng-x>=10)entries.push({t:x,len:ng-x});x=ng;}
      while(x<fe){const len=Math.min(step,fe-x);if(len>=10)entries.push({t:x,len});x+=step;}
    });
    });
    active.forEach(a=>entries.push({a,t:tm(a.vrijeme)}));
    entries.sort((p,q)=>p.t-q.t||(p.a?-1:1));
  }else{
    active.forEach(a=>entries.push({a,t:tm(a.vrijeme)}));
  }
  let gapCard='';
  const nr0=Math.ceil(nm/5)*5,ivNow=h.radi?ivMin(h).find(([o,c])=>nr0>=o&&nr0<c):null;
  if(date===t&&ivNow){
    const close=ivNow[1];
    const nr=nr0;
    const fi=freeIntervals(date,ivNow[0],close,null).find(x=>x[0]<=nr&&nr<x[1]);
    if(fi&&fi[1]<close){
      const from=Math.max(nr,fi[0]),left=fi[1]-from;
      if(left>=10&&left<=90){

  let list='',buf=[],freeCount=0,blocks=0;

    buf=[];

  entries.forEach(e=>{

  }else{

  return (state.mode==='trial'?'<div class="demo-note"><strong>Probna verzija</strong>'+(cfgOk()?'Termini se čuvaju samo na ovom telefonu. Prijavite se u Postavkama da se sinhronizuju.':'Firebase još nije podešen, pa se termini čuvaju samo na ovom telefonu.')+'</div>':'')+
    '<div class="dstrip" id="dstrip" role="group" aria-label="Izbor dana">'+stripHTML+
      '<label class="ds cal" aria-label="Izaberi drugi datum">'+I.cal+'<span class="ds-n">Datum</span><input type="date" id="jump" value="'+date+'"></label></div>'+
    '<div class="dhead"><div><h2>'+esc(rel||DAYS[d.getDay()])+'</h2>'+
      '<p>'+esc((rel?DAYS[d.getDay()]+', ':'')+d.getDate()+'. '+MONTHS_G[d.getMonth()])+(h.radi?(h.posebno?', posebno vrijeme ':', radi ')+ivText(h):', ne radi')+'</p>'+
      '<p class="dsum">'+esc(sum)+'</p>'+remBtn+'</div>'+gameBtn(date)+'</div>'+(state.gamesOpen?'<div class="gpanel">'+gamesHTML(date)+'</div>':'')+gapCard+nextCard+body;
}
const STRIP_CNT={};
function dayStrip(days,sel,act){
  const t=today();
  return days.map(day=>{
    const dd=pd(day);
    const list=byDate(day).filter(a=>a.tip==='klijent'&&a.status!=='otkazan').sort((x,y)=>x.vrijeme.localeCompare(y.vrijeme));
    const cnt=list.length;
    const pk=act+day,pop=STRIP_CNT[pk]!==undefined&&STRIP_CNT[pk]!==cnt&&cnt>0;STRIP_CNT[pk]=cnt;
    const dots=list.slice(0,5).map(a=>'<i style="background:'+svcColor(a)+'"></i>').join('');
    const closed=!hoursFor(day).radi;
    const fr=closed?null:freeShare(day);
    const name=day===t?'Danas':day===addDays(t,1)?'Sutra':DAYS_S[dd.getDay()];
    const gm=gamesOn(day),gta=gm.some(g=>g.tip==='gta');
    const gc=gm.length&&!gta&&gm[0].boje.length?' style="--g1:'+gm[0].boje[0]+';--g2:'+(gm[0].boje[1]||gm[0].boje[0])+'"':'';
    return '<button type="button" class="ds'+(closed?' closed':'')+(gta?' gta-day':gm.length?' game-day':'')+'" data-act="'+act+'" data-date="'+day+'"'+gc+(day===sel?' aria-current="date"':'')+' aria-label="'+esc(longDate(day))+(cnt?', zakazano '+cnt:'')+(closed?', ne radi':'')+(gm.length?', izlazi '+esc(gm.map(g=>g.naziv).join(', ')):'')+'">'+(gm.length&&!gta?'<i class="gm-dot" aria-hidden="true"></i>':'')+(gta?'<i class="gta-tag" aria-hidden="true">GTA</i>':'')+
      (cnt?'<b class="ds-badge'+(pop?' pop':'')+(fr&&fr.free===0?' full':'')+'">'+cnt+'</b>':'')+
      '<span class="ds-n">'+name+'</span><span class="ds-d">'+dd.getDate()+'</span><span class="ds-dots">'+dots+'</span>'+(fr?'<i class="ds-bar'+(fr.free===0?' full':'')+'"><b style="width:'+Math.round(fr.free/fr.total*100)+'%"></b></i>':'')+'</button>';
  }).join('');
}
function fmtIn(m){if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+r+' min':'');}
const FX={added:{},past:{},known:null};
function rowFx(a){
  const now=Date.now();let cls='',dl=0;
  const ad=FX.added[a.id],pt=FX.past[a.id];
  if(ad&&now-ad<1600){cls=' fresh';dl=now-ad;}
  else if(pt&&now-pt<1800){cls=' turning';dl=now-pt;}
  return {cls,style:cls?';animation-delay:-'+dl+'ms':''};
}
function trackPast(){
  if(state.mode==='loading')return;
  if(!FX.known){FX.known=new Set(state.appts.filter(isPastAppt).map(a=>a.id));return;}
  const now=Date.now(),t=today();
  state.appts.forEach(a=>{if(!FX.known.has(a.id)&&isPastAppt(a)){FX.known.add(a.id);if(a.datum===t&&!FX.added[a.id])FX.past[a.id]=now;}});
}

function apptRow(a,isNext){

    (a.status!=='zakazan'?'<em class="tag '+a.status+'">'+STATUS[a.status]+'</em>':'')+

/* Statistika */
function statsRange(){
  const t=today(),o=state.statsOffset;
  if(state.statsPeriod==='sedmica'){
    const mon=addDays(t,-((pd(t).getDay()+6)%7)+o*7),sun=addDays(mon,6);
    const a=pd(mon),b=pd(sun);
    const lab=o===0?'Ova sedmica':o===-1?'Prošla sedmica':a.getDate()+'. '+MONTHS_G[a.getMonth()]+' – '+b.getDate()+'. '+MONTHS_G[b.getMonth()];
    return {from:mon,to:sun,lab};
  }
  if(state.statsPeriod==='mjesec'){
    const d=pd(t);const f=new Date(d.getFullYear(),d.getMonth()+o,1),l=new Date(f.getFullYear(),f.getMonth()+1,0);
    const lab=o===0?'Ovaj mjesec':cap(MONTHS[f.getMonth()])+' '+f.getFullYear()+'.';
    return {from:ds(f),to:ds(l),lab};
  }
  return {from:'0000-00-00',to:'9999-99-99',lab:'Svi podaci'};
}

      '<div><b>'+money(earned)+'</b><span>ostvarena zarada</span></div>'+

/* Raspored na dodir: obojeni sati su radni */
const CELL=30;
function cellOn(iv,t){return iv.some(x=>Math.min(tm(x.do),t+CELL)-Math.max(tm(x.od),t)>=CELL/2);}
function gridRange(iv){let a=6*60;iv.forEach(x=>{a=Math.min(a,Math.floor(tm(x.od)/60)*60);});return [Math.max(0,a),24*60];}
function tLabel(t){return Math.floor(t/60)+':'+pad(t%60);}
function validIv(list){return list.filter(x=>validT(x.od)&&validEnd(x.do)&&tm(x.od)<tm(x.do));}
function getIv(k){
  if(k==='de')return validIv(readIv('de-l'));
  const on=$('#h-'+k+'-on');return on&&on.checked?validIv(readIv('h-'+k+'-l')):[];
}
function setIv(k,iv){
  if(k==='de'){
    const l=document.getElementById('de-l');if(!l)return;
    l.innerHTML=(iv.length?iv:[{od:'08:00',do:'16:00'}]).map(ivRow).join('');
    if(state.dayEdit)state.dayEdit.intervali=iv.length?iv:state.dayEdit.intervali;
    return;
  }
  const l=document.getElementById('h-'+k+'-l'),sw=$('#h-'+k+'-on');if(!l||!sw)return;
  if(iv.length)l.innerHTML=iv.map(ivRow).join('');
  sw.checked=iv.length>0;$('#h-'+k+'-t').hidden=!sw.checked;$('#h-'+k+'-x').hidden=sw.checked;
  markDirty();
}
function weekGridHTML(){
  const model=WEEK_ORDER.map(k=>({k,iv:getIv(k)}));
  const [G0,G1]=gridRange(model.flatMap(m=>m.iv));
  const tk=String(new Date().getDay());
  let h='<div class="wg"><span class="wg-c"></span>'+
    model.map(m=>{const mins=ivMinutes(m.iv);return '<button type="button" class="wg-h'+(state.wgSel===m.k?' sel':'')+(m.k===tk?' today':'')+'" data-act="wg-day" data-k="'+m.k+'"><b>'+DAYS_S[Number(m.k)]+'</b><small>'+(mins?fmtH(mins):'–')+'</small></button>';}).join('');
  for(let t=G0;t<G1;t+=CELL){
    h+='<span class="wg-t'+(t%60?' half':' hr')+'">'+tLabel(t)+'</span>';
    model.forEach(m=>{h+='<i class="wg-cell'+(cellOn(m.iv,t)?' on':'')+(t%60?'':' hr')+(state.wgSel===m.k?' sel':'')+'" data-k="'+m.k+'" data-t="'+t+'"></i>';});
  }
  return h+'</div>';
}

function renderWeekGrid(){const b=document.getElementById('weekGridBox');if(b)b.innerHTML=weekGridHTML();const w=document.getElementById('wgBar');if(w)w.innerHTML=wgBarHTML();}
function dayGridHTML(iv){
  const [G0,G1]=gridRange(iv);
  let h='<div class="dg">';
  for(let t=G0;t<G1;t+=CELL){
    h+='<span class="dg-t'+(t%60?' half':' hr')+'">'+tLabel(t)+'</span><i class="wg-cell dg-cell'+(cellOn(iv,t)?' on':'')+(t%60?'':' hr')+'" data-k="de" data-t="'+t+'"></i>';
  }
  return h+'</div>';
}
let PAINT=null,gridQ=false;
function queueGrid(){if(gridQ)return;gridQ=true;requestAnimationFrame(()=>{gridQ=false;if(!PAINT)renderWeekGrid();});}
function paintCell(c){if(c.classList.contains('on')!==PAINT.mode){c.classList.toggle('on',PAINT.mode);PAINT.touched.add(c.dataset.k);}}
function commitPaint(){
  const p=PAINT;PAINT=null;
  p.touched.forEach(k=>{
    const on=[...p.grid.querySelectorAll('.wg-cell[data-k="'+k+'"].on')].map(x=>+x.dataset.t).sort((a,b)=>a-b);
    const runs=[];for(const t of on){const l=runs[runs.length-1];if(l&&l[1]===t)l[1]=t+CELL;else runs.push([t,t+CELL]);}
    const orig=getIv(k);
    const iv=runs.map(([a,b])=>{let st=a,en=b;orig.forEach(o=>{const os=tm(o.od),oe=tm(o.do);if(os>a&&os<a+CELL&&oe>os)st=os;if(oe<b&&oe>b-CELL&&os<oe)en=oe;});return {od:mt(st),do:mtE(en)};});
    setIv(k,iv);
  });
  if(p.grid.classList.contains('dg')){if(!getIv('de').length&&state.dayEdit){toast('Nijedan sat nije obojen, pa je dan označen kao „Ne radim“.');state.dayEdit.mode='off';$('#sheet').innerHTML=dayEditHTML();}}
  else{renderWeekGrid();}
}
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest&&e.target.closest('.wg-cell');if(!c)return;
  e.preventDefault();
  PAINT={grid:c.closest('.wg,.dg'),mode:!c.classList.contains('on'),touched:new Set()};
  paintCell(c);
});
document.addEventListener('pointermove',e=>{
  if(!PAINT)return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const c=el&&el.closest&&el.closest('.wg-cell');
  if(c&&PAINT.grid.contains(c))paintCell(c);
},{passive:true});
document.addEventListener('pointerup',()=>{if(PAINT)commitPaint();});
document.addEventListener('pointercancel',()=>{if(PAINT)commitPaint();});
function ivRow(x){return '<div class="iv"><input class="inp iv-od" type="time" value="'+esc(x.od)+'" aria-label="Od"><i>do</i><input class="inp iv-do" type="time" value="'+esc(x.do==='24:00'?'23:59':x.do)+'" aria-label="Do (23:59 znači ponoć)"><button type="button" class="iv-del" data-act="iv-del" aria-label="Ukloni ovo vrijeme">'+I.x+'</button></div>';}
function ivEditor(id,iv){return '<div class="iv-list" id="'+id+'">'+(iv||[]).map(ivRow).join('')+'</div><button type="button" class="iv-add" data-act="iv-add" data-t="'+id+'">'+I.plus+' Dodaj još jedno vrijeme</button>';}
function readIv(id){return [...document.querySelectorAll('#'+id+' .iv')].map(r=>{const e=r.querySelector('.iv-do').value.slice(0,5);return {od:r.querySelector('.iv-od').value.slice(0,5),do:e==='23:59'?'24:00':e};});}

function offCalHTML(){
  const s=state.settings,t=today(),cur=t.slice(0,7);
  const ym=state.offMonth<cur?cur:state.offMonth;
  const p=ym.split('-').map(Number),y=p[0],m=p[1];
  const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),lead=(first.getDay()+6)%7;
  const set=new Set(s.neradni||[]);
  let h='<div class="oc-head"><button type="button" class="icon-btn" data-act="off-mon" data-n="-1" aria-label="Prethodni mjesec"'+(ym<=cur?' disabled':'')+'>'+I.left+'</button><strong>'+cap(MONTHS[m-1])+' '+y+'.</strong><button type="button" class="icon-btn" data-act="off-mon" data-n="1" aria-label="Sljedeći mjesec">'+I.right+'</button></div>';
  h+='<div class="oc-grid">'+['Pon','Uto','Sri','Čet','Pet','Sub','Ned'].map(x=>'<span class="oc-wd">'+x+'</span>').join('');
  for(let i=0;i<lead;i++)h+='<span></span>';
  let offN=0;
  for(let d=1;d<=days;d++){
    const ds=y+'-'+pad(m)+'-'+pad(d),dow=new Date(y,m-1,d).getDay();
    const weekly=!(s.radno[String(dow)]||{}).radi,off=set.has(ds),past=ds<t;
    if(off)offN++;
    const appt=state.appts.some(a=>a.datum===ds&&a.tip==='klijent'&&a.status==='zakazan');
    const cust=!off&&!!(s.posebno&&s.posebno[ds]);
    h+='<button type="button" class="oc-d'+(off?' off':'')+(cust?' cust':'')+(weekly&&!cust?' weekly':'')+(ds===t?' today':'')+'" data-act="off-day" data-date="'+ds+'"'+(past?' disabled':'')+' aria-label="'+esc(longDate(ds))+(off?', ne radim':cust?', posebno vrijeme '+esc(ivText(s.posebno[ds])):weekly?', redovno zatvoreno':'')+'">'+d+(appt?'<i></i>':'')+'</button>';
  }
  h+='</div><div class="oc-leg"><span><i class="lg off"></i>Ne radim</span><span><i class="lg cust"></i>Posebno vrijeme</span><span><i class="lg weekly"></i>Zatvoreno sedmično</span><span><i class="lg ldot"></i>Ima termina</span></div>';
  const up=(s.neradni||[]).filter(x=>x>=t).map(x=>({d:x,off:true})).concat(Object.keys(s.posebno||{}).filter(x=>x>=t).map(x=>({d:x,off:false}))).sort((a,b)=>a.d.localeCompare(b.d));
  if(up.length)h+='<div class="oc-list">'+up.slice(0,40).map(x=>'<button type="button" class="oc-chip'+(x.off?'':' cust')+'" data-act="off-day" data-date="'+x.d+'" aria-label="Uredi '+esc(longDate(x.d))+'">'+esc(shortDate(x.d))+(x.off?'':' <small>'+esc(ivText(s.posebno[x.d]))+'</small>')+'</button>').join('')+'</div>';
  return h;
}

async function saveSettings(opt){
  opt=opt||{};
  const msg=$('#setMsg');if(!msg||!$('#setForm'))return true;msg.textContent='';
  const fail=t=>{msg.textContent=t;if(!opt.silent||opt.loud){toast(t);msg.scrollIntoView({block:'center',behavior:'smooth'});}return false;};
  const s=JSON.parse(JSON.stringify(state.settings));
  s.naziv=$('#s-naziv').value.trim()||DEFAULT_SETTINGS.naziv;
  let poz=$('#s-poz').value.replace(/[^\d+]/g,'');if(poz&&!poz.startsWith('+'))poz='+'+poz;s.pozivni=poz||'+387';
  s.valuta=$('#s-val').value.trim()||'KM';
  s.interval=Number($('#s-int').value)||30;
  for(const k of WEEK_ORDER){
    const on=$('#h-'+k+'-on').checked;
    const rows=readIv('h-'+k+'-l');
    const bad=rows.find(x=>!validT(x.od)||!validEnd(x.do)||tm(x.od)>=tm(x.do));
    if(on&&(bad||!rows.length))return fail(DAYS[Number(k)]+': '+(bad?'početak mora biti prije kraja ('+(bad.od||'?')+' – '+(bad.do||'?')+').':'upišite radno vrijeme.'));
    const iv=normIntervals(rows,null)||s.radno[k].intervali;
    s.radno[k]={radi:on,intervali:iv,od:iv[0].od,do:iv[iv.length-1].do};
  }
  const rows=[...document.querySelectorAll('#svcRows .svc-row')];
  const us=[];
  for(const r of rows){
    const n=r.querySelector('[data-f=naziv]').value.trim();
    if(!n)continue;
    const tr=clampInt(r.querySelector('[data-f=trajanje]').value,5,480,NaN);
    if(!Number.isFinite(tr))return fail('Upišite trajanje u minutama za uslugu „'+n+'“.');
    const c=Number(String(r.querySelector('[data-f=cijena]').value).replace(/\./g,'').replace(',','.'))||0;
    us.push({id:r.dataset.id,naziv:n.slice(0,60),trajanje:tr,cijena:Math.max(0,c),boja:clampInt(r.querySelector('.cdot').dataset.i,0,7,0)});
  }
  if(!us.length)return fail('Dodajte barem jednu uslugu.');
  s.usluge=us;
  const ok=await putSettings(s);
  if(ok){
    if(opt.silent){$('#brandName').textContent=state.settings.naziv;const hp=document.querySelector('.set-hero p');if(hp)hp.textContent=state.settings.naziv;flashSaved();}
    else{toast('Postavke sačuvane');render(true);}
  }
  return ok;
}

function openBooking(init){
  const s=state.settings;
  const d=Object.assign({id:null,tip:'klijent',ime:'',telefon:'',uslugaId:'',usluga:'',trajanje:30,cijena:0,datum:today(),vrijeme:'',napomena:'',status:'zakazan',kreirano:0,force:false},init||{});

function slotGrid(date){
  const h=hoursFor(date),step=state.settings.interval;
  const ivs=h.radi?ivMin(h):[[8*60,20*60]];
  const set=new Set(),ends={};
  ivs.forEach(([o,c])=>{
    for(let t=o;t<c;t+=step){set.add(t);ends[t]=c;}
    freeIntervals(date,o,c,state.draft&&state.draft.id).forEach(([fs,fe])=>{if((fs-o)%step&&fe-fs>=10){set.add(fs);ends[fs]=c;}});
  });
  const slots=[...set].sort((a,b)=>a-b);
  return {open:ivs[0][0],close:ivs[ivs.length-1][1],slots,ends,closed:!h.radi};
}

function readDraftInputs(){
  const d=state.draft;if(!d)return;
  const v=id=>{const e=$('#'+id);return e?e.value:null;};
  if(v('f-ime')!==null)d.ime=v('f-ime');
  if(v('f-tel')!==null)d.telefon=v('f-tel');
  if(v('f-nap')!==null)d.napomena=v('f-nap');
  document.querySelectorAll('#sheet [data-k]').forEach(e=>{d.imena[Number(e.dataset.k)]=e.value;});
  if(v('f-cijena')!==null)d.cijena=Number(String(v('f-cijena')).replace(/\./g,'').replace(',','.'))||0;
}
function normName(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');}
function hlName(name,q){const n=normName(name),i=q?n.indexOf(q):-1;if(i<0)return esc(name);return esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+q.length))+'</mark>'+esc(name.slice(i+q.length));}
function updateSugg(){
  const box=$('#sugg');if(!box)return;
  const d=state.draft;
  const cnb=$('#cnote');
  if(cnb){
    const k=(digits(d.telefon).length>=6||String(d.ime||'').trim())?clientKey(d):'';
    const nt=k&&getClients().some(c=>c.key===k)?noteFor(k):'';
    cnb.innerHTML=nt?'<div class="notebox"><small class="nb-l">Stalna bilješka o klijentu</small>'+esc(nt)+'</div>':'';
  }
  if(d.tip==='pauza'){box.innerHTML='';return;}
  const all=getClients();
  const q=normName(d.ime).trim(),qd=digits(d.telefon);
  if(!q&&qd.length<3){
    if(d.id||!all.length){box.innerHTML='';return;}
    const top=all.slice().sort((a,b)=>(b.posjete*2+b.list.length)-(a.posjete*2+a.list.length)||(b.list[0].datum).localeCompare(a.list[0].datum)).slice(0,10);
    box.innerHTML='<div class="sg-l">Česti klijenti, dodirni za brz unos</div><div class="sg-chips">'+top.map(c=>{const p=String(c.ime).trim().split(/\s+/);return '<button type="button" class="sg-chip" data-act="d-sugg" data-key="'+esc(c.key)+'"><span class="av">'+esc(initials(c.ime))+'</span>'+esc(p[0]+(p[1]?' '+p[1][0]+'.':''))+'</button>';}).join('')+'</div>';
    return;
  }
  const cur=clientKey({ime:d.ime,telefon:d.telefon});
  const sc=all.map(c=>{
    const n=normName(c.ime);let v=0;
    if(q){if(n.startsWith(q))v=4;else if(n.split(/\s+/).some(w=>w.startsWith(q)))v=3;else if(n.includes(q))v=1;}
    if(qd.length>=3&&digits(c.telefon).includes(qd))v=Math.max(v,3);
    return {c,v};
  }).filter(x=>x.v>0&&!(x.c.key===cur&&normName(x.c.ime)===q)).sort((a,b)=>b.v-a.v||b.c.posjete-a.c.posjete).slice(0,6);
  box.innerHTML=sc.length?sc.map(({c})=>{
    const last=c.zadnjaUsluga;
    return '<button type="button" class="sg-row" data-act="d-sugg" data-key="'+esc(c.key)+'"><span class="av">'+esc(initials(c.ime))+'</span><span class="sg-t"><strong>'+hlName(c.ime,q)+'</strong><small>'+esc([c.telefon,last&&last.usluga,c.posjete?c.posjete+' '+plural(c.posjete,'posjeta','posjete','posjeta'):'novi'].filter(Boolean).join(', '))+'</small></span>'+I.right+'</button>';
  }).join(''):'';
}
async function saveDraft(){
  readDraftInputs();
  const d=state.draft,msg=$('#formMsg');
  const say=t=>{msg.textContent=t;msg.scrollIntoView({block:'center',behavior:'smooth'});};
  if(d.tip==='klijent'&&!d.ime.trim()&&!d.telefon.trim())return say('Upišite ime ili broj telefona klijenta.');
  if(!validT(d.vrijeme))return say('Izaberite vrijeme termina.');
  const conf=conflicts(d.datum,tm(d.vrijeme),draftDur(d),d.id);
  if(conf.length&&!d.force){d.force=true;refreshBooking();return;}
  const isP=d.tip==='pauza';
  const a={id:d.id||uid('t'),tip:d.tip,datum:d.datum,vrijeme:d.vrijeme,trajanje:d.trajanje,
    ime:isP?(d.ime.trim()||'Pauza'):d.ime.trim(),telefon:isP?'':d.telefon.trim(),
    uslugaId:isP?'':d.uslugaId,usluga:isP?'':d.usluga,cijena:isP?0:d.cijena,
    napomena:d.napomena.trim(),status:d.status||'zakazan',kreirano:d.kreirano||Date.now(),podsjetnik:0,
    grupa:d.grupa||'',grupaRb:d.grupaRb||0,grupaN:d.grupaN||0};
  {const old=d.id?getA(d.id):null;if(old&&old.datum===a.datum&&old.vrijeme===a.vrijeme)a.podsjetnik=old.podsjetnik||0;}
  const btn=$('#sheet [data-act=save]');if(btn){btn.disabled=true;btn.textContent='Čuvam…';}
  FX.added={};
  const nG=(!d.id&&!isP)?(d.osobe||1):1;
  let ok=true;
  if(nG>1){
    const gid=uid('g');
    for(let k=0;k<nG;k++){
      const nm2=k?(((d.imena&&d.imena[k+1])||'').trim()||(a.ime||a.telefon||'Klijent')+' ('+(k+1)+'. osoba)'):a.ime;
      const b=Object.assign({},a,{id:k?uid('t'):a.id,vrijeme:mt(tm(a.vrijeme)+k*a.trajanje),grupa:gid,grupaRb:k+1,grupaN:nG,ime:nm2});
      FX.added[b.id]=Date.now();
      if(!(await putAppt(b))){ok=false;break;}
    }
  }else{FX.added[a.id]=Date.now();ok=await putAppt(a);}
  if(!ok){if(btn){btn.disabled=false;refreshBooking();}return;}
  const wasEdit=!!d.id;
  closeSheet();
  state.date=a.datum;
  if(state.view!=='raspored'&&state.view!=='klijenti')state.view='raspored';
  Object.keys(FX.added).forEach(k=>{FX.added[k]=Date.now();});
  render(true);
  if(wasEdit)toast('Izmjene sačuvane');
  else showBooked(isP?'Vrijeme blokirano':'Zakazano',isP?'':(a.ime||a.telefon)+(nG>1?' + '+(nG-1):''),friendlyDate(a.datum)+' u '+a.vrijeme);
  requestAnimationFrame(()=>{const f=document.querySelector('.ar.fresh');if(f){const r=f.getBoundingClientRect();if(r.top<90||r.bottom>window.innerHeight-90)f.scrollIntoView({block:'center',behavior:'smooth'});}});
}

function ask(text,okLabel){
  return new Promise(res=>{
    const root=$('#dialogRoot');
    root.innerHTML='<div class="dialog-wrap"><div class="dialog" role="alertdialog" aria-modal="true"><p>'+esc(text)+'</p><div class="btn-row two-c" style="margin:0"><button class="btn plain" data-r="0">Odustani</button><button class="btn bad" data-r="1">'+esc(okLabel)+'</button></div></div></div>';
    const done=v=>{root.innerHTML='';res(v);};
    root.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();done(b.dataset.r==='1');}));
    root.querySelector('.dialog-wrap').addEventListener('click',e=>{if(e.target.classList.contains('dialog-wrap'))done(false);});
    root.querySelector('[data-r="1"]').focus();
  });
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act;
  const d=state.draft;
  switch(act){
    case 'nav':if(state.view==='postavke'&&el.dataset.view!=='postavke'&&!(await flushSettings()))break;state.view=el.dataset.view;if(state.view==='raspored'&&!state.sheet){}render(true);window.scrollTo(0,0);if(state.view==='raspored')scrollToNow();break;
    case 'week':state.date=addDays(state.date,Number(el.dataset.n));render();break;
    case 'pick':state.date=el.dataset.date;render();requestAnimationFrame(()=>{const sd=document.querySelector('#dstrip [aria-current="date"]');if(sd)sd.scrollIntoView({inline:'center',block:'nearest'});});if(!hoursFor(state.date).radi&&closedAnimOn())showClosed(state.date);break;
    case 'today':state.date=today();render();scrollToNow();break;
    case 'new':openBooking({datum:state.date,vrijeme:el.dataset.time});break;
    case 'fab':openBooking({datum:state.view==='raspored'?state.date:today()});break;
    case 'open':{const a=getA(el.dataset.id);if(a)openSheet(detailHTML(a),'detail:'+a.id);break;}
    case 'close':closeSheet();break;
    case 'client':{const c=getClients().find(x=>x.key===el.dataset.key);if(c){openSheet(clientSheetHTML(c),'client:'+c.key);if(el.dataset.focus){const f=$('#c-note');if(f){f.scrollIntoView({block:'center'});f.focus();}}}break;}
    case 'save-note':{const f=$('#c-note');if(!f)break;f.blur();if(await saveNote(el.dataset.key,f.value))toast('Bilješka sačuvana');break;}
    case 'rem':openSheet(remHTML(el.dataset.date),'rem:'+el.dataset.date);break;
    case 'rem-sent':{
      const a=getA(el.dataset.id);if(!a)break;
      if(el.dataset.copy){copyText(reminderText(a));toast('Poruka kopirana. Zalijepite je u Viber.');}
      (async()=>{for(const x of groupOf(a)){if(!x.podsjetnik&&!(await putAppt(Object.assign({},x,{podsjetnik:Date.now()}))))break;}})();
      break;
    }
    case 'rebook':{
      const a=getA(el.dataset.id);if(!a)break;
      const w=Number(el.dataset.w),t0=today();
      const u=state.settings.usluge.find(x=>x.id===a.uslugaId);
      const init={ime:a.ime,telefon:a.telefon,uslugaId:a.uslugaId,usluga:a.usluga,trajanje:a.trajanje,cijena:a.cijena,datum:t0};
      if(u){init.uslugaId=u.id;init.usluga=u.naziv;init.trajanje=u.trajanje;init.cijena=u.cijena;}
      if(w){
        let dd=addDays(a.datum,w*7);while(dd<t0)dd=addDays(dd,7);
        init.datum=dd;const h=hoursFor(dd),st=tm(a.vrijeme);
        if(h.radi&&ivMin(h).some(([o,c])=>st>=o&&st+init.trajanje<=c)&&!conflicts(dd,st,init.trajanje,null).length)init.vrijeme=a.vrijeme;
      }
      openBooking(init);
      if(!init.vrijeme&&w)toast('Uobičajeno vrijeme ('+a.vrijeme+') je zauzeto. Izaberite drugo.');
      break;
    }
    case 'svc-color':{const i=(Number(el.dataset.i)+1)%8;el.dataset.i=i;el.style.setProperty('--c',SVC_COLORS[i]);markDirty();break;}
    case 'book-client':{
      const c=getClients().find(x=>x.key===el.dataset.key);if(!c)break;
      const last=c.zadnjaUsluga;const u=last&&state.settings.usluge.find(s=>s.id===last.uslugaId);
      openBooking(Object.assign({ime:c.ime,telefon:c.telefon,datum:state.view==='raspored'?state.date:today()},u?{uslugaId:u.id,usluga:u.naziv,trajanje:u.trajanje,cijena:u.cijena}:{}));
      break;
    }
    case 'd-tip':readDraftInputs();d.tip=el.dataset.v;d.force=false;
      if(d.tip==='pauza'){if(!d.id){d.ime='';d.trajanje=30;}}
      else if(!d.uslugaId&&state.settings.usluge[0]){const u=state.settings.usluge[0];d.uslugaId=u.id;d.usluga=u.naziv;d.trajanje=u.trajanje;d.cijena=u.cijena;if(d.ime==='Pauza')d.ime='';}
      refreshBooking();updateSugg();break;
    case 'd-svc':{readDraftInputs();const u=state.settings.usluge.find(s=>s.id===el.dataset.id);if(u){d.uslugaId=u.id;d.usluga=u.naziv;d.trajanje=u.trajanje;d.cijena=u.cijena;d.force=false;}refreshBooking();updateSugg();break;}
    case 'd-day':readDraftInputs();d.datum=el.dataset.date||el.dataset.v;d.force=false;refreshBooking();break;
    case 'd-time':readDraftInputs();d.vrijeme=el.dataset.v;d.force=false;d.pickOpen=false;refreshBooking();
      if(d.tip==='klijent'&&!d.ime&&!d.telefon){const f=$('#f-ime');if(f)f.scrollIntoView({block:'center',behavior:'smooth'});}
      break;
    case 'd-pick':readDraftInputs();d.pickOpen=!(d.pickOpen||!d.vrijeme);refreshBooking();break;
    case 'd-sugg':{
      readDraftInputs();const c=getClients().find(x=>x.key===el.dataset.key);if(!c)break;
      d.ime=c.ime;d.telefon=c.telefon;
      const last=c.zadnjaUsluga;const u=last&&state.settings.usluge.find(s=>s.id===last.uslugaId);
      if(u&&!d.id){d.uslugaId=u.id;d.usluga=u.naziv;d.trajanje=u.trajanje;d.cijena=u.cijena;}
      refreshBooking();$('#sugg').innerHTML='';
      if(c.sljedeca)toast(c.ime+' već ima termin: '+friendlyDate(c.sljedeca.datum)+' u '+c.sljedeca.vrijeme);
      break;
    }
    case 'save':saveDraft();break;
    case 'edit':{const a=getA(el.dataset.id);if(a)openBooking(Object.assign({},a));break;}
    case 'st':{
      const a=getA(el.dataset.id);if(!a)break;
      const upd={status:el.dataset.v};let early=0;
      if(el.dataset.v==='zavrsen'&&a.datum===today()&&a.status==='zakazan'){
        const nm=nowMin(),st=tm(a.vrijeme);
        if(nm>st&&nm<endOf(a)-4){const nd=Math.max(5,Math.ceil((nm-st)/5)*5);if(nd<a.trajanje){early=a.trajanje-nd;upd.trajanje=nd;}}
      }
      const ok=await putAppt(Object.assign({},a,upd));
      if(ok){toast(early?'Završeno ranije. Oslobođeno '+early+' min ('+mt(st0(a)+upd.trajanje)+'–'+mt(endOf(a))+')':el.dataset.v==='zavrsen'?'Označeno kao završeno':el.dataset.v==='nije_dosao'?'Označeno: nije došao':'Termin je ponovo zakazan');const b=getA(a.id);if(b){if(state.sheet==='detail:'+a.id)$('#sheet').innerHTML=detailHTML(b);else if(el.dataset.v==='zavrsen')openSheet(detailHTML(b),'detail:'+b.id);}}
      break;
    }
    case 'cancel-grp':{
      const a=getA(el.dataset.id);if(!a)break;
      const g=groupOf(a).filter(x=>x.status==='zakazan');
      if(!(await ask('Otkazati cijelu rezervaciju ('+g.length+' osobe, '+friendlyDate(a.datum)+')?','Otkaži sve')))break;
      let okAll=true;for(const x of g){if(!(await putAppt(Object.assign({},x,{status:'otkazan'})))){okAll=false;break;}}
      if(okAll){closeSheet();toast('Rezervacija otkazana');}
      break;
    }
    case 'd-os':readDraftInputs();d.osobe=Number(el.dataset.v)||1;d.force=false;refreshBooking();break;
    case 'cancel':{
      const a=getA(el.dataset.id);if(!a)break;
      if(!(await ask('Otkazati termin za '+(a.ime||a.telefon||'klijenta')+' ('+friendlyDate(a.datum)+' u '+a.vrijeme+')? Termin ostaje u historiji kao otkazan.','Otkaži termin')))break;
      if(await putAppt(Object.assign({},a,{status:'otkazan'}))){closeSheet();toast('Termin otkazan');}
      break;
    }
    case 'del':{
      const a=getA(el.dataset.id);if(!a)break;
      if(!(await ask('Trajno obrisati ovaj termin? Ovo se ne može vratiti.','Obriši')))break;
      if(await removeAppt(a.id)){closeSheet();toast('Termin obrisan');}
      break;
    }
    case 'sp':state.statsPeriod=el.dataset.v;state.statsOffset=0;render();break;
    case 'so':state.statsOffset=Math.min(0,state.statsOffset+Number(el.dataset.n));render();break;
    case 'mark-done':{
      const list=state.appts.filter(a=>a.tip==='klijent'&&a.status==='zakazan'&&isPastAppt(a));
      if(!list.length)break;
      if(!(await ask('Označiti '+list.length+' '+plural(list.length,'prošli termin','prošla termina','prošlih termina')+' kao završen?','Označi')))break;
      el.disabled=true;let n=0;
      for(const a of list){if(await putAppt(Object.assign({},a,{status:'zavrsen'})))n++;else break;}
      toast(n+' '+plural(n,'termin označen','termina označena','termina označeno')+' kao završen');render();
      break;
    }
    case 'add-svc':{const box=$('#svcRows');box.insertAdjacentHTML('beforeend',svcRow({id:uid('s'),naziv:'',trajanje:30,cijena:'',boja:box.children.length%8}));box.lastElementChild.querySelector('[data-f=naziv]').focus();markDirty();break;}
    case 'del-svc':el.closest('.svc-row').remove();markDirty();break;
    case 'about':openSheet(aboutHTML(),'about');break;
    case 'guide':openSheet(guideHTML(),'guide');break;
    case 'set-tab':{state.setTab=el.dataset.v;if(state.setTab==='radno')requestAnimationFrame(renderWeekGrid);document.querySelectorAll('.set-pane').forEach(p=>{p.hidden=p.dataset.tab!==state.setTab;});document.querySelectorAll('[data-act="set-tab"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===state.setTab)));window.scrollTo(0,0);el.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});break;}
    case 'off-mon':{const p=state.offMonth.split('-').map(Number);const d=new Date(p[0],p[1]-1+Number(el.dataset.n),1);state.offMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);const c=$('#offCal');if(c)c.innerHTML=offCalHTML();break;}
    case 'off-day':{
      const d0=el.dataset.date,s0=state.settings;
      const mode=(s0.neradni||[]).includes(d0)?'off':(s0.posebno&&s0.posebno[d0])?'cust':'reg';
      const b=s0.radno[String(pd(d0).getDay())];
      state.dayEdit={date:d0,mode,intervali:JSON.parse(JSON.stringify(mode==='cust'?s0.posebno[d0].intervali:(b.radi?b.intervali:[{od:'08:00',do:'12:00'},{od:'16:00',do:'20:00'}])))};
      openSheet(dayEditHTML(),'dayedit');
      break;
    }
    case 'de-mode':{const e2=state.dayEdit;if(!e2)break;if(document.getElementById('de-l')){const r=readIv('de-l');if(r.length)e2.intervali=r;}e2.mode=el.dataset.v;$('#sheet').innerHTML=dayEditHTML();break;}
    case 'de-save':{
      const e2=state.dayEdit;if(!e2)break;const msg=$('#deMsg');
      const s2=JSON.parse(JSON.stringify(state.settings));
      s2.neradni=(s2.neradni||[]).filter(x=>x!==e2.date&&x>=today());
      s2.posebno=s2.posebno||{};delete s2.posebno[e2.date];
      Object.keys(s2.posebno).forEach(k=>{if(k<today())delete s2.posebno[k];});
      if(e2.mode==='off')s2.neradni.push(e2.date);
      if(e2.mode==='cust'){
        const rows=readIv('de-l');const bad=rows.find(x=>!validT(x.od)||!validEnd(x.do)||tm(x.od)>=tm(x.do));
        if(bad||!rows.length){msg.textContent=bad?'Početak mora biti prije kraja ('+(bad.od||'?')+' – '+(bad.do||'?')+').':'Dodajte bar jedno vrijeme.';break;}
        s2.posebno[e2.date]={intervali:normIntervals(rows,rows)};
      }
      s2.neradni.sort();
      await putSettings(s2);state.settings=mergeSettings(s2);
      closeSheet();const c=$('#offCal');if(c)c.innerHTML=offCalHTML();
      toast(e2.mode==='off'?shortDate(e2.date)+': ne radiš':e2.mode==='cust'?shortDate(e2.date)+': radiš '+ivText(state.settings.posebno[e2.date]):shortDate(e2.date)+': po redovnom rasporedu');
      state.dayEdit=null;break;
    }
    case 'wg-day':{state.wgSel=state.wgSel===el.dataset.k?null:el.dataset.k;state.wgCopy=null;renderWeekGrid();break;}
    case 'wg-copy':{state.wgCopy=new Set();$('#wgBar').innerHTML=wgBarHTML();break;}
    case 'wg-copy-day':{const k=el.dataset.k;if(state.wgCopy.has(k))state.wgCopy.delete(k);else state.wgCopy.add(k);el.setAttribute('aria-pressed',String(state.wgCopy.has(k)));break;}
    case 'wg-copy-all':{WEEK_ORDER.forEach(k=>{if(k!==state.wgSel&&getIv(k).length)state.wgCopy.add(k);});$('#wgBar').innerHTML=wgBarHTML();break;}
    case 'wg-copy-apply':{
      const src=state.wgSel,iv=getIv(src),tg=[...(state.wgCopy||[])];
      if(!tg.length){toast('Izaberi bar jedan dan');break;}
      tg.forEach(k=>setIv(k,JSON.parse(JSON.stringify(iv))));
      state.wgCopy=null;renderWeekGrid();toast(DAYS[Number(src)]+' kopiran na '+tg.length+' '+plural(tg.length,'dan','dana','dana')+'. Sačuvaj promjene.');break;
    }
    case 'wg-clear':{const k=state.wgSel;setIv(k,getIv(k).length?[]:[{od:'08:00',do:'16:00'}]);renderWeekGrid();break;}
    case 'iv-add':{
      const box=document.getElementById(el.dataset.t);if(!box)break;
      const rows=box.querySelectorAll('.iv');if(rows.length>=6){toast('Najviše 6 vremena u danu');break;}
      const last=rows.length?rows[rows.length-1].querySelector('.iv-do').value:'';
      const lastE=last==='23:59'?'24:00':last;
      let st=validEnd(lastE)?Math.min(tm(lastE)+60,23*60):8*60;let en=Math.min(st+240,1440);
      box.insertAdjacentHTML('beforeend',ivRow({od:mt(st),do:mtE(en)}));
      if(box.closest('[data-form]'))markDirty();queueGrid();if(box.id==='de-l'){const g=document.getElementById('dayGridBox');if(g)g.innerHTML=dayGridHTML(validIv(readIv('de-l')));}break;
    }
    case 'iv-del':{
      const box=el.closest('.iv-list');if(!box)break;
      if(box.querySelectorAll('.iv').length<=1){toast(box.id==='de-l'?'Mora ostati bar jedno vrijeme. Za slobodan dan izaberi „Ne radim“.':'Mora ostati bar jedno vrijeme. Za slobodan dan isključi prekidač.');break;}
      el.closest('.iv').remove();if(box.closest('[data-form]'))markDirty();queueGrid();if(box.id==='de-l'){const g=document.getElementById('dayGridBox');if(g)g.innerHTML=dayGridHTML(validIv(readIv('de-l')));}break;
    }
    case 'export':exportFile();break;
    case 'logout':{if(!(await ask('Odjaviti se s ovog telefona? Termini ostaju sačuvani u bazi.','Odjavi se')))break;try{await FB.au.signOut(FB.auth);}catch(e){}setTrial(false);location.reload();break;}
    case 'login-open':{if(!cfgOk()){toast('Prvo upišite Firebase podatke u firebase-config.js');break;}setTrial(false);if(!FB.au){try{await loadFirebase();}catch(e){toast('Nema interneta.');break;}FB.au.onAuthStateChanged(FB.auth,u=>{if(u){hideLogin();startCloud(u);}});}showLogin();break;}
    case 'pin-key':pinKey(el.dataset.k);break;
    case 'pin-del':pinDel();break;
    case 'pin-change':openSheet(pinSheetHTML(),'pin');break;
    case 'pin-save':savePin();break;
    case 'reset-pass':doReset();break;
    case 'trial':setTrial(true);startTrial();toast('Probna verzija: podaci samo na ovom telefonu');break;
    case 'games-toggle':{state.gamesOpen=!state.gamesOpen;render();break;}
    case 'save-set':saveSettings();break;
    case 'skin':setSkin(el.dataset.v);break;
    case 'flip':{
      if(e.target.closest('.tk-item'))break;
      if(!el.classList.contains('can-flip')){toast('Trenutno nema vijesti');break;}
      const on=!el.classList.contains('flipped');
      el.classList.toggle('flipped',on);el.setAttribute('aria-pressed',String(on));
      if(on){markNewsSeen();if(typeof loadFeeds==='function')loadFeeds();}
      break;
    }
    case 'flip-logo':{
      el.classList.remove('spin');void el.offsetWidth;el.classList.add('spin');
      const fl=document.getElementById('brandFlip');if(!fl)break;
      if(!fl.classList.contains('can-flip')){toast('Trenutno nema vijesti');break;}
      const on=!fl.classList.contains('flipped');
      fl.classList.toggle('flipped',on);fl.setAttribute('aria-pressed',String(on));
      if(on){markNewsSeen();if(typeof loadFeeds==='function')loadFeeds();}
      break;
    }
    case 'news-del':{const s2=JSON.parse(JSON.stringify(state.settings));s2.obavijesti.splice(Number(el.dataset.i),1);await putSettings(s2);toast('Obavijest uklonjena');break;}
    case 'news-add':{const f=$('#n-text');const v=f?f.value.trim():'';if(!v){toast('Upišite tekst obavijesti');break;}const s2=JSON.parse(JSON.stringify(state.settings));s2.obavijesti=[v].concat(s2.obavijesti||[]).slice(0,20);await putSettings(s2);f.value='';toast('Obavijest dodana na traku');break;}
    case 'sync-info':toast(state.mode==='cloud'?'Termini su sinhronizovani na svim tvojim uređajima.':state.mode==='trial'?'Probna verzija: termini se čuvaju samo na ovom telefonu.':state.mode==='loading'?'Povezivanje sa bazom termina…':state.mode==='offline'?'Nema interneta. Izmjene se čuvaju i pošalju kad se veza vrati.':'Greška veze s bazom. Pokušajte osvježiti stranicu.');break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest&&t.closest('[data-form]'))markDirty();
  if(t.closest&&t.closest('#hoursList'))queueGrid();
  if(t.id==='cq'){state.clientQuery=t.value;$('#clientList').innerHTML=clientItems();return;}
  if(!state.draft)return;
  if(t.dataset&&t.dataset.k){state.draft.imena[Number(t.dataset.k)]=t.value;return;}
  if(t.id==='f-ime'){state.draft.ime=t.value;updateSugg();}
  else if(t.id==='f-tel'){state.draft.telefon=t.value;updateSugg();}
  else if(t.id==='f-nap'){state.draft.napomena=t.value;}
  else if(t.id==='f-cijena'){readDraftInputs();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='importFile'&&t.files&&t.files[0]){
    const f=t.files[0];t.value='';
    f.text().then(async txt=>{
      let obj;try{obj=JSON.parse(txt);}catch(e){toast('Fajl nije ispravan.');return;}
      if(!obj||obj.aplikacija!=='frizer-rakic'){toast('Ovo nije fajl iz aplikacije Frizer kuće Rakića.');return;}
      const n=(obj.termini||[]).length;
      if(!(await ask('Uvesti '+n+' '+plural(n,'termin','termina','termina')+', klijentske bilješke i postavke? Postojeći termini ostaju.','Uvezi')))return;
      try{const k=await importData(obj);toast('Uvezeno '+k+' '+plural(k,'termin','termina','termina'));}catch(e){toast(errMsg(e));}
    });
    return;
  }
  if(t.id==='jump'&&validD(t.value)){state.date=t.value;render();if(!hoursFor(state.date).radi&&closedAnimOn())showClosed(state.date);return;}
  if(t.id==='gamesOn'){try{localStorage.setItem('rakic.igre',t.checked?'1':'0');}catch(e){}toast(t.checked?'Datumi igara uključeni':'Datumi igara isključeni');return;}
  if(t.id==='tickerOn'){try{localStorage.setItem('rakic.ticker',t.checked?'1':'0');}catch(e){}renderTicker();return;}
  if(t.id==='soundOn'){try{localStorage.setItem('rakic.zvuk',t.checked?'1':'0');}catch(e){}if(t.checked)playClosedSound(true);toast(t.checked?'Zvuk uključen':'Zvuk isključen');return;}
  if(t.id==='closedAnim'){try{localStorage.setItem('rakic.zatvorenoAnim',t.checked?'1':'0');}catch(e){}toast(t.checked?'Animacija za neradni dan uključena':'Animacija za neradni dan isključena');return;}
  if(t.id==='splashOn'){setSplash(t.checked);toast(t.checked?'Animacija će se prikazati pri sljedećem otvaranju':'Animacija isključena');return;}
  if(t.dataset&&t.dataset.hk){const k=t.dataset.hk;$('#h-'+k+'-t').hidden=!t.checked;$('#h-'+k+'-x').hidden=t.checked;markDirty();queueGrid();return;}
  if(t.closest&&t.closest('#hoursList'))queueGrid();
  if(t.closest&&t.closest('#de-l')){const g=document.getElementById('dayGridBox');if(g)g.innerHTML=dayGridHTML(validIv(readIv('de-l')));}
  if(t.closest&&t.closest('[data-form]')){markDirty();}
  if(!state.draft)return;
  const d=state.draft;
  if(t.id==='f-datum'&&validD(t.value)){readDraftInputs();d.datum=t.value;d.force=false;refreshBooking();updateSugg();}
  else if(t.id==='f-vrijeme'&&t.value){readDraftInputs();const v=t.value.slice(0,5);if(validT(v)){d.vrijeme=v;d.force=false;d.pickOpen=false;refreshBooking();}}
  else if(t.id==='f-pauza'){readDraftInputs();d.tip=t.checked?'pauza':'klijent';d.force=false;
    if(d.tip==='pauza'){if(!d.id&&d.ime&&!d.telefon){}else if(!d.id)d.ime='';}
    else{if(d.ime==='Pauza')d.ime='';if(!d.uslugaId&&state.settings.usluge[0]){const u=state.settings.usluge[0];d.uslugaId=u.id;d.usluga=u.naziv;d.trajanje=u.trajanje;d.cijena=u.cijena;}}
    refreshBooking();}
  else if(t.id==='f-traj'){readDraftInputs();d.trajanje=Number(t.value)||30;d.force=false;refreshBooking();updateSugg();}
});
document.addEventListener('toggle',e=>{if(e.target.id==='more'&&state.draft)state.draft.moreOpen=e.target.open;},true);
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet();});
document.addEventListener('keydown',e=>{const lg=$('#login');if(lg&&!lg.hidden&&!(e.target&&e.target.id==='lg-email')){if(/^\d$/.test(e.key)){pinKey(e.key);e.preventDefault();return;}if(e.key==='Backspace'){pinDel();e.preventDefault();return;}}if(e.key==='Escape'){if($('#dialogRoot').innerHTML)return;if(state.sheet)closeSheet();}});

// osvježi liniju „sada“ svake minute
setInterval(()=>{if(state.view==='raspored'&&!document.hidden)render();},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.view==='raspored')render();});

initStore();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
})();
</script>
</body>
